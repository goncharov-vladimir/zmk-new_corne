# Левая половинка — DEBUG сборка. Всё ещё BLE-периферия (пара с донглом
# нужна, слой передаётся только по relay) — отличие от обычной прошивки
# только в USB-консоли для логов. Использование:
#   1. make build-dongle && прошить донгл (тоже с CONFIG_ZMK_USB_LOGGING=y)
#   2. make build-left-debug && прошить левую половинку
#   3. screen /dev/tty.usbmodem<донгл> 115200  (окно 1)
#      screen /dev/tty.usbmodem<половинка> 115200  (окно 2)
#   4. Переключай слой на клавиатуре, сверяй метки времени в обоих логах.
# Цвет/маска слоя Numbers НЕ переопределяются — используется реальный
# eyelash_corne_left.conf (стрелки синим), чтобы тест отражал прод-поведение.

CONFIG_WS2812_WIDGET_LED_TEST=y

# --- USB CDC ACM Console ---
CONFIG_ZMK_USB_LOGGING=y
