#
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y



CONFIG_WS2812_STRIP=y
# RGB Underglow - DISABLED (using WS2812 widget instead)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_POINTING=y

# PWM-backlight ВКЛЮЧЁН (как в оригинале). На этой плате PWM0 на пине P1.13,
# а WS2812 на P1.12 (SPI3) — РАЗНЫЕ пины, конфликта нет. На corne+nice!view
# этот сигнал нужен дисплею (VCOM/удержание картинки) — без него экран
# выцветает в белый. Поэтому НЕ отключаем.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- ЕДИНЫЕ BLE-настройки для донгла И половинок (КРИТИЧНО для пейринга) ---
# Грузится как prefix-конфиг и для шилда eyelash_corne_dongle, поэтому все
# три устройства получают одинаковые параметры связи. Без этого:
#  * EXPERIMENTAL_CONN был только на донгле → PHY_2M рассинхрон (центр 1M,
#    половинки 2M) → нестабильное соединение;
#  * не было ALLOW_UNAUTH_OVERWRITE → повторный пейринг после перепрошивки
#    отвергался ("pairing failed reason 0x3"), клавиатура не печатала.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# Половинки/донгл без ввода — passkey не требуем (Just Works pairing).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

#soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable WS2812 widget
CONFIG_WS2812_WIDGET=y

# Enable LED strip support
CONFIG_LED_STRIP=y

# SPI support (for nRF52 boards)
CONFIG_SPI=y

# Optional: Customize timing
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=100

# Battery colors (hex RGB values - Green, Yellow, Orange, Red)
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x00FF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0xFFFF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0xFF8000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0xFF0000

# Отключить индикацию USB-подключения зелёным миганием
CONFIG_WS2812_WIDGET_CONN_SHOW_USB=n

# Connectivity colors (Green USB, Blue BLE connected, Cyan advertising, Red disconnected)
CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x00FF00
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x0000FF
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x00FFFF
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0xFF0000

# Layer colors used by diagnostics and animation state. The actual six-group
# hint layouts are configured in config/ws2812_led_layouts.h.
CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x00FF00
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0xFF8C00
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0x00BFFF

# Six-bit compatibility masks. Per-half values override these defaults.
CONFIG_WS2812_WIDGET_LAYER_0_MASK=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_MASK=0x00003F
CONFIG_WS2812_WIDGET_LAYER_2_MASK=0x00003F
CONFIG_WS2812_WIDGET_LAYER_3_MASK=0x00003F

# Layer change blink indication (White for blink patterns)
CONFIG_WS2812_WIDGET_LAYER_COLOR=0xFFFFFF

# Feature toggles
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=y

# Индикация подключения/батареи ОТКЛЮЧЕНА: в переписанном widget.c эти
# обработчики спят (k_sleep 150-400мс) прямо в событийном потоке при каждом
# событии связи → BLE-линк рвётся по supervision timeout (reason 0x08),
# половинки бесконечно переподключаются и не печатают.
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=n
CONFIG_WS2812_WIDGET_SHOW_BATTERY=n

# Suppress Kconfig warnings (LVGL etc are upstream, not ours)
CONFIG_WARN_DEPRECATED=n
