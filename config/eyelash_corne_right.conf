# Актуальная визуальная настройка каждой клавиши находится в
# config/ws2812_led_layouts.h. Значения ниже сохранены для совместимости
# с Kconfig и диагностическими сообщениями драйвера.
# На слое Numbers правая сторона содержит цифровой блок.
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x00FF00

# Six confirmed column addresses; edit colors in config/ws2812_led_layouts.h.

# Layer 0 (Base): all LEDs off
CONFIG_WS2812_WIDGET_LAYER_0_MASK=0x000000

# Layer 1 (Numbers): five columns containing N0-N9.
CONFIG_WS2812_WIDGET_LAYER_1_MASK=0x00001F

# Layer 2 (Symbols): all six columns.
CONFIG_WS2812_WIDGET_LAYER_2_MASK=0x00003F

# Layer 3 (Fn): all six columns.
CONFIG_WS2812_WIDGET_LAYER_3_MASK=0x00003F

# Diagnostic LED scan is disabled in normal firmware.
CONFIG_WS2812_WIDGET_LED_TEST=n
