# ============================================================
# LED PER-KEY TEST — Lights up individual LEDs one at a time per layer
# ============================================================
# Прошей эту конфигурацию чтобы определить порядок LED на цепочке.
#
# КАК ТЕСТИРОВАТЬ:
# 1. Прошей половинку (левую или правую) с этим конфигом
# 2. Переключай слои (MO 1, MO 2, etc.)
# 3. На каждом слое будет гореть ТОЛЬКО ОДИН LED (светодиод)
# 4. Запиши: Слой N → горит LED индекс K → какие клавиши подсвечены
# 5. Если LED K подсвечивает 1 клавишу  → per-key (21 LED, chain-length=21 верно)
#    Если LED K подсвечивает столбец 3-4 клавиш → per-column (6 LED, chain-length=6)
# 6. После теста верни оригинальный eyelash_corne.conf
#
# Маски (бит N = LED N):
#   LED 0 = 0x1      LED 1 = 0x2      LED 2 = 0x4
#   LED 3 = 0x8      LED 4 = 0x10     LED 5 = 0x20
#   LED 6 = 0x40     ...              LED 20 = 0x100000
# ============================================================

# Layer 0: Base — всё выключено (чёрный)
CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_0_MASK=0x000000

# Layer 1: LED 0 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_1_MASK=0x1

# Layer 2: LED 1 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_2_MASK=0x2

# Layer 3: LED 2 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_3_MASK=0x4

# Layer 4: LED 3 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_4_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_4_MASK=0x8

# Layer 5: LED 4 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_5_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_5_MASK=0x10

# Layer 6: LED 5 — БЕЛЫЙ
CONFIG_WS2812_WIDGET_LAYER_6_COLOR=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_6_MASK=0x20
