# Донгл не имеет подсветки — отключаем явно, т.к. eyelash_corne.conf (подхватывается
# как prefix-конфиг) включает CONFIG_ZMK_BACKLIGHT=y для клавиатурных половинок.
CONFIG_ZMK_BACKLIGHT=n
# Донгл проксирует статус батареи периферии — репортинг нужен.
CONFIG_ZMK_BATTERY_REPORTING=y

# --- Split central (донгл) ---
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Увеличенные очереди для двух периферий (по умолчанию 5 — мало)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=8

# The EC11 is physically connected to the left peripheral. Compile only the
# receiver/keymap side on the dongle; do not create a fake local sensor device.
CONFIG_ZMK_SPLIT_REMOTE_SENSORS=y
CONFIG_ZMK_SPLIT_REMOTE_SENSOR_COUNT=1
CONFIG_ZMK_SPLIT_REMOTE_SENSOR_TRIGGERS_PER_ROTATION=15

# --- ATT MTU exchange (КРИТИЧНО для relay подсветки слоёв) ---
# Без MTU exchange ATT MTU остаётся дефолтным 23 байта. Write поведения
# &ws2812_layer (~32 байта) в него не влезает → "No ATT channel for MTU 35",
# err -12. Position-нотификации (6 байт) и батарея (1) при MTU 23 проходят,
# поэтому клавиши работают, а relay подсветки — нет.
# AUTO_UPDATE_MTU заставляет центр согласовать MTU=65 после подключения.
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# Больше BT TX-буферов под relay на 2 периферии (помещаем ATT-write в 1 ACL-буфер).
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_CONN_TX_MAX=12

# Keymap исполняется теперь на донгле: нужен pointing для &mmv/&msc/&mkp
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Виджеты OLED (englmaxi/zmk-dongle-display)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# Дисплей донгла всегда включён — не гасить при простое.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- RGB-ретрансляция на половинки ---
# Донгл компилирует только behaviors ретрансляции слоя
# (&ws2812_wdg/&ws2812_layer),
# БЕЗ полного виджета. CONFIG_WS2812_WIDGET=y на донгле НЕЛЬЗЯ: виджет без
# реальной ленты блокирует событийный поток ZMK своими blink-sleep'ами →
# не подключается вторая периферия, не переключаются слои.
CONFIG_WS2812_WIDGET=n
CONFIG_ZMK_WS2812_LAYER_BEHAVIOR=y

# Отладка: LOG_INF через USB CDC ACM (screen /dev/tty.usbmodem* 115200)
CONFIG_ZMK_USB_LOGGING=y
