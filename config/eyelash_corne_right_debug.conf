# Правая половинка — DEBUG сборка. Всё ещё BLE-периферия (пара с донглом
# нужна, слой передаётся только по relay) — отличие от обычной прошивки
# только в USB-консоли для логов. См. eyelash_corne_left_debug.conf для
# методики (тот же принцип: логи донгла + логи половинки одновременно).
# Маска/цвет слоя Numbers НЕ переопределяются — используется реальный
# eyelash_corne_right.conf (цифры зелёным).

CONFIG_WS2812_WIDGET_LED_TEST=y

# --- USB CDC ACM Console ---
CONFIG_ZMK_USB_LOGGING=y
