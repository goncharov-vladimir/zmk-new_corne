# Dongle setup: nice_nano_v2 = central, both halves = peripherals.
# Flash order: settings_reset → dongle → left → right.
---
include:
  # ── Dongle (central) + OLED display ──
  - board: nice_nano_v2
    shield: eyelash_corne_dongle dongle_display
    artifact-name: nice_nano_v2_dongle

  # ZMK Studio variant (uncomment when needed):
  # - board: nice_nano_v2
  #   shield: eyelash_corne_dongle dongle_display
  #   snippet: studio-rpc-usb-uart
  #   cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  #   artifact-name: nice_nano_v2_dongle_studio

  # ── Keyboard halves (peripherals) ──
  - board: eyelash_corne_left
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: eyelash_corne_left

  - board: eyelash_corne_right
    shield: nice_view
    artifact-name: eyelash_corne_right

  # ── Settings reset ──
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
